billing-service.uriport=8084
billing-service.datasource-url=jdbc:mysql://localhost:3306/billing_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
billing-service.username=root
billing-service.password=
billing-service.hibernate-ddl-auto=update
billing-service.showsql=true
billing-service.urlregistry=http://localhost:8761/eureka/

# Feign vers user-service
spring.cloud.openfeign.client.config.user-service.connect-timeout=5000
spring.cloud.openfeign.client.config.user-service.read-timeout=5000

# Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,refresh
management.endpoint.health.show-details=always
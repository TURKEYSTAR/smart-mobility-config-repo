trip-service.uriport=8082
trip-service.datasource-url=jdbc:mysql://localhost:3306/trip_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
trip-service.username=root
trip-service.password=
trip-service.hibernate-ddl-auto=update
trip-service.showsql=true
trip-service.urlregistry=http://localhost:8761/eureka/

# =============================================
# RESILIENCE4J - Circuit Breaker sur pricing-service
# =============================================
resilience4j.circuitbreaker.instances.pricing-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.pricing-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.pricing-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pricing-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pricing-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.pricing-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.timelimiter.instances.pricing-service.timeout-duration=3s
resilience4j.retry.instances.pricing-service.max-attempts=2
resilience4j.retry.instances.pricing-service.wait-duration=500ms

# =============================================
# RABBITMQ
# =============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.name=smart-mobility-exchange
rabbitmq.queue.trip-completed=trip.completed.queue
rabbitmq.queue.pricing-fallback=pricing.fallback.queue
rabbitmq.routing-key.trip-completed=trip.completed
rabbitmq.routing-key.pricing-fallback=pricing.fallback.used

# =============================================
# ZIPKIN - Distributed Tracing
# =============================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,refresh
management.endpoint.health.show-details=always

# =============================================
# FEIGN - Timeout
# =============================================
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# =============================================
# LOGS
# =============================================
logging.level.com.smartmobility=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n
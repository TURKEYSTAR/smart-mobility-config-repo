api-gateway.uriport=8080
api-gateway.urlregistry=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/passes/**

spring.cloud.gateway.routes[1].id=trip-service
spring.cloud.gateway.routes[1].uri=lb://trip-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/trips/**

spring.cloud.gateway.routes[2].id=pricing-service
spring.cloud.gateway.routes[2].uri=lb://pricing-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pricing/**

spring.cloud.gateway.routes[3].id=billing-service
spring.cloud.gateway.routes[3].uri=lb://billing-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/billing/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# ✅ git config (api-gateway.properties dans ton dépôt Git)
jwt.secret=smart-mobility-pass-secret-key-256-bits-minimum-requis
jwt.expiration=86400000
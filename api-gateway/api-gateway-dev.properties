api-gateway.uriport=8080
api-gateway.urlregistry=http://localhost:8761/eureka/

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true

# Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Discovery locator (optionnel, les routes sont définies dans GatewayConfig.java)
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# JWT (doit être identique à auth-service)
jwt.secret=smart-mobility-pass-secret-key-256-bits-minimum-requis
jwt.expiration=86400000

spring.cloud.loadbalancer.eureka.enabled=true
eureka.instance.prefer-ip-address=true
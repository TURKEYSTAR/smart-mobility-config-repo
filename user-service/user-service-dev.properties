user-service.uriport=8081
user-service.datasource-url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
user-service.username=root
user-service.password=
user-service.hibernate-ddl-auto=update
user-service.showsql=true
user-service.urlregistry=http://localhost:8761/eureka/

# =============================================
# RABBITMQ
# =============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange.name=smart-mobility-exchange
rabbitmq.queue.trip-completed=trip.completed.queue
rabbitmq.queue.pricing-fallback=pricing.fallback.queue
rabbitmq.queue.insufficient-balance=insufficient.balance.queue
rabbitmq.queue.pass-suspended=pass.suspended.queue

rabbitmq.routing-key.trip-completed=trip.completed
rabbitmq.routing-key.pricing-fallback=pricing.fallback.used
rabbitmq.routing-key.insufficient-balance=insufficient.balance
rabbitmq.routing-key.pass-suspended=pass.suspended

rabbitmq.routing-key.pass-activated=pass.activated
rabbitmq.routing-key.recharge-refused=recharge.refused

# Zipkin Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
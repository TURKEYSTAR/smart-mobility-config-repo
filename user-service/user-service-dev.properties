user-service.uriport=8081
user-service.datasource-url=jdbc:mysql://localhost:3306/user_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
user-service.username=root
user-service.password=root
user-service.hibernate-ddl-auto=update
user-service.showsql=true
user-service.urlregistry=http://localhost:8761/eureka/

# Zipkin Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
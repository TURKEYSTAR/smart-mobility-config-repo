pricing-service.uriport=8083
pricing-service.datasource-url=jdbc:mysql://localhost:3306/pricing_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
pricing-service.username=root
pricing-service.password=
pricing-service.hibernate-ddl-auto=update
pricing-service.showsql=true
pricing-service.urlregistry=http://localhost:8761/eureka/

# =============================================
# RESILIENCE4J - Circuit Breaker sur billing-service
# =============================================
resilience4j.circuitbreaker.instances.billing-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.billing-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.billing-service.wait-duration-in-open-state=10s

# =============================================
# REGLES TARIFAIRES
# =============================================
pricing.rules.bus-classique.base-price=150
pricing.rules.bus-classique.price-per-km=25
pricing.rules.brt.base-price=200
pricing.rules.brt.price-per-km=35
pricing.rules.ter.base-price=300
pricing.rules.ter.price-per-km=50

pricing.discount.off-peak=20
pricing.discount.tier.silver=10
pricing.discount.tier.gold=15
pricing.discount.tier.platinum=30
pricing.discount.loyalty.trips-required=10
pricing.discount.loyalty.percentage=5

pricing.daily-cap=5000
pricing.off-peak.start-hour=22
pricing.off-peak.end-hour=6

# =============================================
# ZIPKIN - Distributed Tracing
# =============================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,refresh
management.endpoint.health.show-details=always

# =============================================
# FEIGN - Timeout
# =============================================
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=3000

# =============================================
# LOGS
# =============================================
logging.level.com.smartmobility=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n